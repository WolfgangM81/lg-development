http:
  routers:
    # Host-based routing (Proxy Domains)
    traefik-dashboard-domain:
      entryPoints:
        - web
      rule: Host(`traefik.lg.local`)
      priority: 100
      service: api@internal

    admin-domain:
      entryPoints:
        - web
      rule: Host(`admin.lg.local`)
      priority: 50
      service: admin-ui

    api-domain:
      entryPoints:
        - web
      rule: Host(`api.lg.local`)
      priority: 50
      service: admin-ui

    # Path-based routing (works on ALL hosts with higher priority)
    api-user:
      entryPoints:
        - web
      rule: PathPrefix(`/api/user`)
      priority: 100
      service: user-service

    api-user-health:
      entryPoints:
        - web
      rule: Path(`/api/user/health`)
      priority: 150
      middlewares:
        - api-user-health-rewrite
      service: user-service

    api-permissions:
      entryPoints:
        - web
      rule: PathPrefix(`/api/permissions`)
      priority: 100
      service: permissions-service

    api-rbac:
      entryPoints:
        - web
      rule: PathPrefix(`/api/rbac`)
      priority: 100
      service: permissions-service

    api-permissions-health:
      entryPoints:
        - web
      rule: Path(`/api/permissions/health`)
      priority: 150
      middlewares:
        - api-permissions-health-rewrite
      service: permissions-service

    api-api-keys:
      entryPoints:
        - web
      rule: PathPrefix(`/api/v1`)
      priority: 100
      service: api-keys-service

    api-tour:
      entryPoints:
        - web
      rule: PathPrefix(`/api/tour`)
      priority: 100
      service: tour-service

    api-tour-health:
      entryPoints:
        - web
      rule: Path(`/api/tour/health`)
      priority: 150
      middlewares:
        - api-tour-health-rewrite
      service: tour-service

    api-menu:
      entryPoints:
        - web
      rule: PathPrefix(`/api/menu`)
      priority: 100
      service: menu-service

    api-secrets:
      entryPoints:
        - web
      rule: PathPrefix(`/api/secrets`)
      priority: 100
      service: secrets-service

    api-audit:
      entryPoints:
        - web
      rule: PathPrefix(`/api/audit`)
      priority: 100
      service: secrets-service

    # Admin UI Fallback (lowest priority, catches all other requests)
    admin:
      entryPoints:
        - web
      rule: PathPrefix(`/`)
      priority: 1
      service: admin-ui

  middlewares:
    api-user-health-rewrite:
      replacePath:
        path: /health

    api-permissions-health-rewrite:
      replacePath:
        path: /health

    api-tour-health-rewrite:
      replacePath:
        path: /health

  services:
    user-service:
      loadBalancer:
        servers:
          - url: http://user-service:3002

    permissions-service:
      loadBalancer:
        servers:
          - url: http://permissions-service:3003

    api-keys-service:
      loadBalancer:
        servers:
          - url: http://api-keys-service:3001

    tour-service:
      loadBalancer:
        servers:
          - url: http://tour-service:3004

    menu-service:
      loadBalancer:
        servers:
          - url: http://menu-service:3005

    secrets-service:
      loadBalancer:
        servers:
          - url: http://secrets-service:3007

    # Admin UI - Vite Frontend
    admin-ui:
      loadBalancer:
        servers:
          - url: http://lg-frontend-admin:3000
