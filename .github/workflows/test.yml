name: Test All Repositories

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - lg-user-service
          - lg-permissions-service
          - lg-api-keys-service
          - lg-menu-service
          - lg-secrets-service
          - lg-admin-ui
          - lg-admin
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: repos/${{ matrix.repo }}/package-lock.json

      - name: Configure npm for GitHub Packages
        run: |
          echo "@wolfgangm81:registry=https://npm.pkg.github.com" > repos/${{ matrix.repo }}/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> repos/${{ matrix.repo }}/.npmrc

      - name: Check if tests exist
        id: check-tests
        run: |
          if [ -f "repos/${{ matrix.repo }}/package.json" ]; then
            if grep -q '"test"' "repos/${{ matrix.repo }}/package.json"; then
              echo "has-tests=true" >> $GITHUB_OUTPUT
            else
              echo "has-tests=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has-tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-tests.outputs.has-tests == 'true'
        working-directory: repos/${{ matrix.repo }}
        run: npm ci || npm install

      - name: Run tests
        if: steps.check-tests.outputs.has-tests == 'true'
        working-directory: repos/${{ matrix.repo }}
        run: npm test

      - name: Skip tests
        if: steps.check-tests.outputs.has-tests == 'false'
        run: echo "No tests found for ${{ matrix.repo }}"

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run tests with coverage
        run: |
          ./scripts/test-coverage.sh || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## 📊 Test Coverage Report\n\n';

            const coverageDir = 'coverage';
            if (fs.existsSync(coverageDir)) {
              const repos = fs.readdirSync(coverageDir).filter(f =>
                fs.statSync(path.join(coverageDir, f)).isDirectory()
              );

              comment += `Found coverage for ${repos.length} repositories\n\n`;
              comment += '| Repository | Status |\n';
              comment += '|------------|--------|\n';

              repos.forEach(repo => {
                comment += `| ${repo} | ✅ Coverage generated |\n`;
              });
            } else {
              comment += 'No coverage reports generated\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed"
            exit 1
          fi
