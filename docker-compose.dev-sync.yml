volumes:
  lg-packages-dist:
    driver: local

services:
  # Builder für lg-menu-registry
  menu-registry-builder:
    image: node:20-alpine
    container_name: lg-builder-menu-registry
    working_dir: /app
    volumes:
      - ./repos/lg-menu-registry/src:/app/src:ro
      - ./repos/lg-menu-registry/tsconfig.build.json:/app/tsconfig.json:ro
      - ./repos/lg-menu-registry/package.json:/app/package.json:ro
      - lg-packages-dist:/dist
    command: >
      sh -c "
      echo '🔄 Starting TypeScript watch mode for menu-registry...' &&
      rm -rf /dist/menu-registry/*.test.js /dist/menu-registry/*.test.d.ts /dist/menu-registry/*.test.*.map &&
      cp /app/package.json /dist/menu-registry/package.json 2>/dev/null || true &&
      npx -y -p typescript@5.3.3 tsc --watch --project /app/tsconfig.json --pretty
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /dist/menu-registry/index.js && ! grep -q 'error TS' /proc/1/fd/1 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Builder für lg-backend-common
  backend-common-builder:
    image: node:20-alpine
    container_name: lg-builder-backend-common
    working_dir: /app
    volumes:
      - ./repos/lg-backend-common/src:/app/src:ro
      - ./repos/lg-backend-common/tsconfig.build.json:/app/tsconfig.json:ro
      - ./repos/lg-backend-common/package.json:/app/package.json:ro
      - lg-packages-dist:/dist
    command: >
      sh -c "
      echo '🔄 Starting TypeScript watch mode for backend-common...' &&
      rm -rf /dist/backend-common/*.test.js /dist/backend-common/*.test.d.ts /dist/backend-common/*.test.*.map &&
      cp /app/package.json /dist/backend-common/package.json 2>/dev/null || true &&
      npx -y -p typescript@5.3.3 tsc --watch --project /app/tsconfig.json --pretty
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /dist/backend-common/index.js && ! grep -q 'error TS' /proc/1/fd/1 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Builder für lg-types
  types-builder:
    image: node:20-alpine
    container_name: lg-builder-types
    working_dir: /app
    volumes:
      - ./repos/lg-types/src:/app/src:ro
      - ./repos/lg-types/tsconfig.build.json:/app/tsconfig.json:ro
      - ./repos/lg-types/package.json:/app/package.json:ro
      - lg-packages-dist:/dist
    command: >
      sh -c "
      echo '🔄 Starting TypeScript watch mode for types...' &&
      rm -rf /dist/types/*.test.js /dist/types/*.test.d.ts /dist/types/*.test.*.map &&
      cp /app/package.json /dist/types/package.json 2>/dev/null || true &&
      npx -y -p typescript@5.3.3 tsc --watch --project /app/tsconfig.json --pretty
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /dist/types/index.js && ! grep -q 'error TS' /proc/1/fd/1 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
