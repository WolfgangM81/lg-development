volumes:
  lg-packages-dist:
    driver: local

services:
  # Builder für lg-menu-registry
  menu-registry-builder:
    image: node:20-alpine
    container_name: lg-builder-menu-registry
    working_dir: /app
    volumes:
      - ./repos/lg-menu-registry/src:/app/src:ro
      - ./repos/lg-menu-registry/tsconfig.build.json:/app/tsconfig.json:ro
      - ./repos/lg-menu-registry/package.json:/app/package.json:ro
      - lg-packages-dist:/dist
    command: >
      sh -c "
      echo '🔄 Starting TypeScript watch mode for menu-registry...' &&
      rm -rf /dist/menu-registry/*.test.js /dist/menu-registry/*.test.d.ts /dist/menu-registry/*.test.*.map &&
      node -e \"
      const fs = require('fs');
      const pkg = JSON.parse(fs.readFileSync('/app/package.json', 'utf8'));
      const distPkg = {
        name: pkg.name,
        version: pkg.version,
        description: pkg.description,
        type: 'commonjs',
        main: './index.js',
        types: './index.d.ts',
        exports: {
          '.': { types: './index.d.ts', require: './index.js', default: './index.js' },
          './client': { types: './client.d.ts', require: './client.js', default: './client.js' }
        },
        repository: pkg.repository,
        publishConfig: pkg.publishConfig,
        license: pkg.license || 'MIT',
        author: pkg.author
      };
      fs.writeFileSync('/dist/menu-registry/package.json', JSON.stringify(distPkg, null, 2));
      console.log('✅ Generated dist package.json');
      \" &&
      npx -y -p typescript@5.3.3 tsc --watch --project /app/tsconfig.json --pretty
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /dist/menu-registry/index.js && test -f /dist/menu-registry/index.d.ts && node -c /dist/menu-registry/index.js"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

